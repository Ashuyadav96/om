[project]
name = "mimo-proxy"
version = "3.0.0"
description = "Advanced multi-language OpenAI + Anthropic + Gemini compatible API proxy for Xiaomi MiMo AI Studio"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
